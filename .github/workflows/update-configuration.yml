name: "Update Configuration and Build"

on:
  workflow_dispatch:
  push:

jobs:
  update:
    name: "Update Configuration & Build"
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: Meniole/action-deploy-plugin@feat/27-generate-manifest-metadata
        with:
          pluginEntry: "${{ github.workspace }}/src/workflow-entry.ts"
          schemaPath: "${{ github.workspace }}/src/types/plugin-inputs.ts"
          treatAsEsm: true
          sourceMap: true
          excludeSupportedEvents: "issue_comment.created"
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
